name: APEE synthetic CI acceptance
on:
  pull_request:
    branches: ["codex/ci-acceptance-base-3240c42b5a5e"]
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest -v test_local test_ci
